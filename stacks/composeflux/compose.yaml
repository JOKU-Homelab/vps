name: composeflux

services:
  composeflux:
    image: ghcr.io/veerendra2/composeflux:v0.19.0
    container_name: composeflux
    restart: unless-stopped
    env_file:
      - ${BOOTSTRAP_DIR:-/etc/vps-bootstrap}/composeflux.env
    environment:
      GIT_INTERVAL: 5m
      GIT_CLONE_PATH: /opt/vps/composeflux/repo
      STACK_PATH: stacks
      INFISICAL_SITE_URL: ${INFISICAL_DOMAIN:-https://eu.infisical.com}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?Set INFISICAL_PROJECT_ID in Infisical bootstrap config}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENVIRONMENT:-prod}
      INFISICAL_SECRET_PATH: ${INFISICAL_SECRET_PATH:-/}
      GIT_REPO_URL: ${COMPOSEFLUX_GIT_REPO_URL:?Set COMPOSEFLUX_GIT_REPO_URL in Infisical}
      GIT_BRANCH: ${COMPOSEFLUX_GIT_BRANCH:-main}
      PRUNE_INTERVAL: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/vps/composeflux/repo:/opt/vps/composeflux/repo:z
      # ComposeFlux resolves absolute env_file paths while loading discovered
      # stacks. Keep this directory root-owned and read-only in the container.
      - ${BOOTSTRAP_DIR:-/etc/vps-bootstrap}:/etc/vps-bootstrap:ro,z
    security_opt:
      - label=disable
    networks:
      - pangolin

networks:
  pangolin:
    external: true
    name: pangolin_frontend
