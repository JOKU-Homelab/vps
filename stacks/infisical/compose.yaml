name: infisical

services:
  backend:
    image: infisical/infisical:v0.167.9
    container_name: infisical-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in the local Infisical bootstrap environment}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the local Infisical bootstrap environment}
      SITE_URL: ${SITE_URL:?Set SITE_URL to the public Infisical URL}
      DB_CONNECTION_URI: ${DB_CONNECTION_URI:?Set DB_CONNECTION_URI in Infisical}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in Infisical}
    expose:
      - "8080"
    # Bootstrap access before the identity provider is running. This port is
    # reachable only from the VPS; use an SSH tunnel and remove it after SSO is
    # available through Pangolin.
    ports:
      - "127.0.0.1:8080:8080"
    labels:
      - pangolin.public-resources.infisical.name=Infisical
      - pangolin.public-resources.infisical.mode=http
      - pangolin.public-resources.infisical.full-domain=${INFISICAL_PUBLIC_DOMAIN:?Set INFISICAL_PUBLIC_DOMAIN for the Pangolin route}
      - pangolin.public-resources.infisical.targets[0].method=http
      - pangolin.public-resources.infisical.targets[0].hostname=infisical-api
      - pangolin.public-resources.infisical.targets[0].port=8080
      - pangolin.public-resources.infisical.auth.sso-enabled=true
    networks:
      default: {}
      pangolin:
        aliases:
          - infisical-api

  db:
    image: postgres:17.12-alpine3.24
    container_name: infisical-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in Infisical}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in Infisical}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Infisical}
    volumes:
      - type: bind
        source: /opt/vps/data/infisical/postgresql
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
          selinux: Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - default

  redis:
    image: redis:7.4.12-alpine3.22
    container_name: infisical-redis
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in Infisical}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - type: bind
        source: /opt/vps/data/infisical/redis
        target: /data
        bind:
          create_host_path: false
          selinux: Z
    networks:
      - default

networks:
  default: {}
  pangolin:
    external: true
    name: pangolin_frontend
