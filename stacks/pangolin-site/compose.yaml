name: pangolin-site

services:
  pangolin-site:
    image: fosrl/pangolin-cli:0.19
    container_name: pangolin-site
    restart: unless-stopped
    command: ["up", "site"]
    environment:
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT:?Set PANGOLIN_ENDPOINT in Infisical}
      SITE_ID: ${SITE_ID:?Set SITE_ID in Infisical}
      SITE_SECRET: ${SITE_SECRET:?Set SITE_SECRET in Infisical}
      DOCKER_SOCKET: /var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - label=disable
    networks:
      - pangolin

networks:
  pangolin:
    external: true
    name: pangolin_frontend
