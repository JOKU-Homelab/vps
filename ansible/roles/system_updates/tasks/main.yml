---
- name: Install DNF Automatic
  ansible.builtin.dnf:
    name: dnf-automatic
    state: present

- name: Configure automatic security updates without automatic reboots
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: commands
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - { option: upgrade_type, value: security }
    - { option: apply_updates, value: 'yes' }
    - { option: reboot, value: never }

- name: Enable the automatic update timer
  ansible.builtin.systemd:
    name: dnf-automatic-install.timer
    state: started
    enabled: true
