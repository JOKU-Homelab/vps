---
- name: Ensure backup staging directory exists
  ansible.builtin.file:
    path: /opt/vps/backup/staging
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Install backup and recovery command
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/vps-backup"
    dest: /usr/local/sbin/vps-backup
    owner: root
    group: root
    mode: '0750'

- name: Install Infisical runtime wrapper for backup credentials
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/vps-infisical-run"
    dest: /usr/local/sbin/vps-infisical-run
    owner: root
    group: root
    mode: '0750'

- name: Install backup systemd service
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/vps-backup.service"
    dest: /etc/systemd/system/vps-backup.service
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Install backup systemd timer
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../files/vps-backup.timer"
    dest: /etc/systemd/system/vps-backup.timer
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd

- name: Check whether Infisical bootstrap credentials have been provisioned
  ansible.builtin.stat:
    path: /etc/vps-bootstrap/infisical.env
  register: infisical_bootstrap

- name: Enable daily backups after credentials are installed
  ansible.builtin.systemd:
    name: vps-backup.timer
    enabled: true
    state: started
    daemon_reload: true
  when: infisical_bootstrap.stat.exists and infisical_bootstrap.stat.uid == 0 and infisical_bootstrap.stat.mode == '0600'

- name: Keep daily backups disabled until credentials are installed
  ansible.builtin.systemd:
    name: vps-backup.timer
    enabled: false
    state: stopped
    daemon_reload: true
  when: not infisical_bootstrap.stat.exists or infisical_bootstrap.stat.uid != 0 or infisical_bootstrap.stat.mode != '0600'
