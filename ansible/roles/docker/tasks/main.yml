---
- name: Install Docker repository prerequisites
  ansible.builtin.dnf:
    name: dnf-plugins-core
    state: present

- name: Add the official Docker repository
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable - $basearch
    baseurl: https://download.docker.com/linux/centos/$releasever/$basearch/stable
    enabled: true
    gpgcheck: true
    gpgkey: https://download.docker.com/linux/centos/gpg

- name: Install Docker Engine and Compose plugin
  ansible.builtin.dnf:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Detect SELinux mode when Docker is run without the security role
  ansible.builtin.command: getenforce
  register: docker_selinux_mode
  changed_when: false
  when: vps_selinux_enabled is not defined

- name: Set Docker SELinux support from the current host mode
  ansible.builtin.set_fact:
    vps_selinux_enabled: "{{ docker_selinux_mode.stdout != 'Disabled' }}"
  when: vps_selinux_enabled is not defined

- name: Configure conservative Docker daemon defaults
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {
        "live-restore": true,
        "log-driver": "local",
        "selinux-enabled": {{ (vps_selinux_enabled | default(false)) | bool | lower }}
      }
  notify: Restart Docker

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
