---
- name: Start ComposeFlux after Infisical is initialized
  hosts: localhost
  connection: local
  become: true
  vars:
    composeflux_credentials: /etc/vps-bootstrap/composeflux.env
    composeflux_compose: "{{ playbook_dir }}/../../stacks/composeflux/compose.yaml"
  tasks:
    - name: Check for the root-only ComposeFlux Infisical credentials
      ansible.builtin.stat:
        path: "{{ composeflux_credentials }}"
      register: composeflux_env

    - name: Require a root-owned ComposeFlux credentials file
      ansible.builtin.assert:
        that:
          - composeflux_env.stat.exists
          - composeflux_env.stat.uid == 0
          - composeflux_env.stat.mode == '0600'
        fail_msg: >-
          Create {{ composeflux_credentials }} with the Infisical machine identity
          values and mode 0600 before enabling ComposeFlux.

    - name: Read ComposeFlux bootstrap settings without exposing credentials
      ansible.builtin.slurp:
        src: "{{ composeflux_credentials }}"
      register: composeflux_env_raw
      no_log: true

    - name: Require a configured Infisical machine identity
      ansible.builtin.assert:
        that:
          - "'SET_AFTER_INFISICAL_SETUP' not in (composeflux_env_raw.content | b64decode)"
          - "'INFISICAL_CLIENT_ID=' in (composeflux_env_raw.content | b64decode)"
          - "'INFISICAL_CLIENT_SECRET=' in (composeflux_env_raw.content | b64decode)"
          - "'INFISICAL_PROJECT_ID=' in (composeflux_env_raw.content | b64decode)"
        fail_msg: Update the project and identity values in /etc/vps-bootstrap/composeflux.env.
      no_log: true

    - name: Confirm the Pangolin network and Infisical API are reachable
      ansible.builtin.command: docker network inspect pangolin_frontend
      changed_when: false

    - name: Start ComposeFlux from its repository-managed stack definition
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - "{{ composeflux_credentials }}"
          - -f
          - "{{ composeflux_compose }}"
          - up
          - -d
      register: composeflux_start
      changed_when: "'Started' in composeflux_start.stdout or 'Created' in composeflux_start.stdout"
