---
- name: Start ComposeFlux after Infisical is initialized
  hosts: localhost
  connection: local
  become: true
  vars:
    composeflux_credentials: /etc/vps-bootstrap/composeflux.env
    composeflux_compose: "{{ playbook_dir }}/../../stacks/composeflux/compose.yaml"
  tasks:
    - name: Check for the root-only ComposeFlux Infisical identity
      ansible.builtin.stat:
        path: "{{ composeflux_credentials }}"
      register: composeflux_env

    - name: Require a root-owned ComposeFlux credentials file
      ansible.builtin.assert:
        that:
          - composeflux_env.stat.exists
          - composeflux_env.stat.uid == 0
          - composeflux_env.stat.mode == '0600'
        fail_msg: >-
          Complete Pangolin setup and add the read-only ComposeFlux identity to Infisical before enabling ComposeFlux.

    - name: Confirm the Pangolin network exists
      ansible.builtin.command: docker network inspect pangolin_frontend
      changed_when: false

    - name: Start ComposeFlux from its repository-managed stack definition
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - "{{ composeflux_credentials }}"
          - -f
          - "{{ composeflux_compose }}"
          - up
          - -d
      environment:
        INFISICAL_DOMAIN: "{{ lookup('env', 'INFISICAL_DOMAIN') }}"
        INFISICAL_PROJECT_ID: "{{ lookup('env', 'INFISICAL_PROJECT_ID') }}"
        INFISICAL_ENVIRONMENT: "{{ lookup('env', 'INFISICAL_ENVIRONMENT') }}"
        INFISICAL_SECRET_PATH: "{{ lookup('env', 'INFISICAL_SECRET_PATHS') }}"
        COMPOSEFLUX_GIT_REPO_URL: "{{ lookup('env', 'COMPOSEFLUX_GIT_REPO_URL') }}"
        COMPOSEFLUX_GIT_BRANCH: "{{ lookup('env', 'COMPOSEFLUX_GIT_BRANCH') | default('main', true) }}"
      register: composeflux_start
      changed_when: "'Started' in composeflux_start.stdout or 'Created' in composeflux_start.stdout"
      no_log: true
