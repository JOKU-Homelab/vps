---
- name: Initialize a fresh VPS and bootstrap core services
  hosts: localhost
  connection: local
  become: true
  vars:
    ansible_admin_group: wheel
    vps_base_domain: "{{ lookup('env', 'VPS_BASE_DOMAIN') }}"
    vps_admin_email: "{{ lookup('env', 'VPS_ADMIN_EMAIL') }}"
    vps_smtp_enabled: "{{ lookup('env', 'SMTP_ENABLED') | default('no', true) == 'yes' }}"
    vps_smtp_host: "{{ lookup('env', 'SMTP_HOST') }}"
    vps_smtp_port: "{{ lookup('env', 'SMTP_PORT') | default('465', true) }}"
    vps_smtp_secure: "{{ lookup('env', 'SMTP_SECURE') | default('true', true) }}"
    vps_smtp_from_address: "{{ lookup('env', 'SMTP_FROM_ADDRESS') }}"
    vps_admin_user: "{{ lookup('env', 'VPS_ADMIN_USER') | default('admin', true) }}"
    vps_admin_ssh_public_key: "{{ lookup('env', 'VPS_ADMIN_SSH_PUBLIC_KEY') }}"
    vps_users:
      - name: "{{ vps_admin_user }}"
        comment: VPS administrator
        shell: /bin/bash
        groups: [wheel, docker]
        public_key: "{{ vps_admin_ssh_public_key }}"
        passwordless_sudo: true
      - name: ansible
        comment: Ansible service account
        shell: /bin/bash
        groups: [wheel]
        public_key: "{{ vps_admin_ssh_public_key }}"
        key_options: no-pty,no-agent-forwarding,no-port-forwarding,no-X11-forwarding
        passwordless_sudo: true
  pre_tasks:
    - name: Check protected bootstrap environment files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/vps-bootstrap/infisical.env
      register: bootstrap_files

    - name: Require root-only bootstrap environment files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.uid == 0
          - item.stat.mode == '0600'
        fail_msg: "{{ item.item }} must exist and have root:root mode 0600."
      loop: "{{ bootstrap_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      no_log: true

    - name: Require host-specific bootstrap settings
      ansible.builtin.assert:
        that:
          - vps_base_domain | length > 3
          - vps_admin_email | length > 5
          - vps_users | length >= 1
        fail_msg: Run install.sh with access to the required Infisical project values.
      no_log: true

  roles:
    - users
    - ssh
    - security
    - system_updates
    - docker
    - backup

  tasks:
    - name: Apply Docker daemon and firewall handlers before starting containers
      ansible.builtin.meta: flush_handlers

    - name: Restore the selected snapshot before starting services
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/vps-backup
          - restore-host
          - "{{ vps_restore_snapshot }}"
          - --yes
      when: vps_restore_snapshot is defined

    - name: Create persistent service data directories with container ownership
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/vps/data, owner: root, group: root, mode: '0750' }
        - { path: /opt/vps/data/authentik/postgresql, owner: '70', group: '70', mode: '0700' }
        - { path: /opt/vps/data/authentik/data, owner: '1000', group: '1000', mode: '0750' }
        - { path: /opt/vps/data/authentik/templates, owner: '1000', group: '1000', mode: '0750' }
        - { path: /opt/vps/data/authentik/certs, owner: '1000', group: '1000', mode: '0750' }
        - { path: /opt/vps/data/databasement, owner: '1000', group: '1000', mode: '0750' }
        - { path: /opt/vps/data/database-backups, owner: '1000', group: '1000', mode: '0750' }
        - { path: /opt/vps/data/beszel, owner: '1000', group: '1000', mode: '0750' }
        - { path: /opt/vps/data/backrest/data, owner: root, group: root, mode: '0700' }
        - { path: /opt/vps/data/backrest/config, owner: root, group: root, mode: '0700' }
        - { path: /opt/vps/data/backrest/cache, owner: root, group: root, mode: '0700' }
        - { path: /opt/vps/data/backrest/tmp, owner: root, group: root, mode: '0700' }
        - { path: /opt/vps/backup/staging, owner: root, group: root, mode: '0700' }
        - { path: /opt/pangolin/config, owner: root, group: root, mode: '0750' }
        - { path: /opt/pangolin/config/traefik, owner: root, group: root, mode: '0750' }
        - { path: /opt/pangolin/config/letsencrypt, owner: root, group: root, mode: '0750' }
        - { path: /opt/pangolin/data/runtime, owner: root, group: root, mode: '0750' }

    - name: Render Pangolin's non-secret server configuration from the repository template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../stacks/pangolin/config.yml.j2"
        dest: /opt/pangolin/config/config.yml
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Render Traefik's repository-managed static configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../stacks/pangolin/traefik_config.yml.j2"
        dest: /opt/pangolin/config/traefik/traefik_config.yml
        owner: root
        group: root
        mode: "0640"

    - name: Start the repository-managed Pangolin stack
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - -f
          - "{{ playbook_dir }}/../../stacks/pangolin/compose.yaml"
          - up
          - -d
      environment:
        BASE_DOMAIN: "{{ vps_base_domain }}"
        SERVER_SECRET: "{{ lookup('env', 'SERVER_SECRET') }}"
        SMTP_USERNAME: "{{ lookup('env', 'SMTP_USERNAME') | default('', true) }}"
        SMTP_PASSWORD: "{{ lookup('env', 'SMTP_PASSWORD') | default('', true) }}"
      register: pangolin_start
      changed_when: "'Started' in pangolin_start.stdout or 'Created' in pangolin_start.stdout"
      no_log: true

    - name: Wait for Pangolin's shared Docker network
      ansible.builtin.command: docker network inspect pangolin_frontend
      changed_when: false

    - name: Report core service bootstrap status
      ansible.builtin.debug:
        msg:
          - "Pangolin Compose started from the repository."
          - "Core configuration and service secrets were fetched from Infisical."
          - "Complete Pangolin site setup before enabling ComposeFlux."
