---
- name: Initialize a fresh VPS and bootstrap core services
  hosts: localhost
  connection: local
  become: true
  vars_files:
    - /etc/vps-bootstrap/site.yml
  vars:
    ansible_admin_group: wheel
  pre_tasks:
    - name: Check protected bootstrap environment files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/vps-bootstrap/infisical.env
        - /etc/vps-bootstrap/pangolin.env
        - /etc/vps-bootstrap/composeflux.env
      register: bootstrap_files

    - name: Require root-only bootstrap environment files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.uid == 0
          - item.stat.mode == '0600'
        fail_msg: "{{ item.item }} must exist and have root:root mode 0600."
      loop: "{{ bootstrap_files.results }}"
      loop_control:
        label: "{{ item.item }}"
      no_log: true

    - name: Require host-specific bootstrap settings
      ansible.builtin.assert:
        that:
          - vps_base_domain is defined
          - vps_admin_email is defined
          - vps_users | length >= 1
        fail_msg: Run install.sh to create root-only bootstrap configuration first.
      no_log: true

  roles:
    - users
    - ssh
    - security
    - system_updates
    - docker
    - backup

  tasks:
    - name: Apply Docker daemon and firewall handlers before starting containers
      ansible.builtin.meta: flush_handlers

    - name: Restore the selected snapshot before starting services
      ansible.builtin.command:
        argv:
          - /usr/local/sbin/vps-backup
          - restore-host
          - "{{ vps_restore_snapshot }}"
          - --yes
      when: vps_restore_snapshot is defined

    - name: Read restored Pangolin bootstrap configuration
      ansible.builtin.slurp:
        src: /etc/vps-bootstrap/pangolin.env
      register: restored_pangolin_bootstrap
      when: vps_restore_snapshot is defined
      no_log: true

    - name: Read restored Infisical bootstrap configuration
      ansible.builtin.slurp:
        src: /etc/vps-bootstrap/infisical.env
      register: restored_infisical_bootstrap
      when: vps_restore_snapshot is defined
      no_log: true

    - name: Require the original Pangolin domain for a full restore
      ansible.builtin.assert:
        that:
          - "('BASE_DOMAIN=' ~ vps_base_domain) in (restored_pangolin_bootstrap.content | b64decode).splitlines()"
          - "('SITE_URL=https://infisical.' ~ vps_base_domain) in (restored_infisical_bootstrap.content | b64decode).splitlines()"
        fail_msg: >-
          The selected snapshot belongs to a different base domain. Re-run the
          installer with the original domain before starting restored services.
      when: vps_restore_snapshot is defined
      no_log: true

    - name: Create persistent service data directories with container ownership
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: /opt/vps/data, owner: root, group: root, mode: '0750' }
        - { path: /opt/vps/data/infisical/postgresql, owner: '70', group: '70', mode: '0700' }
        - { path: /opt/vps/data/infisical/redis, owner: '999', group: '1000', mode: '0750' }
        - { path: /opt/vps/data/authentik/postgresql, owner: '70', group: '70', mode: '0700' }
        - { path: /opt/vps/data/authentik/data, owner: '1000', group: '1000', mode: '0750' }
        - { path: /opt/vps/data/authentik/templates, owner: '1000', group: '1000', mode: '0750' }
        - { path: /opt/vps/data/authentik/certs, owner: '1000', group: '1000', mode: '0750' }
        - { path: /opt/vps/data/databasement, owner: '1000', group: '1000', mode: '0750' }
        - { path: /opt/vps/data/database-backups, owner: '1000', group: '1000', mode: '0750' }
        - { path: /opt/vps/data/beszel, owner: '1000', group: '1000', mode: '0750' }
        - { path: /opt/vps/data/backrest/data, owner: root, group: root, mode: '0700' }
        - { path: /opt/vps/data/backrest/config, owner: root, group: root, mode: '0700' }
        - { path: /opt/vps/data/backrest/cache, owner: root, group: root, mode: '0700' }
        - { path: /opt/vps/data/backrest/tmp, owner: root, group: root, mode: '0700' }
        - { path: /opt/vps/backup/staging, owner: root, group: root, mode: '0700' }
        - { path: /opt/pangolin/config, owner: root, group: root, mode: '0750' }
        - { path: /opt/pangolin/config/traefik, owner: root, group: root, mode: '0750' }
        - { path: /opt/pangolin/config/letsencrypt, owner: root, group: root, mode: '0750' }
        - { path: /opt/pangolin/data/runtime, owner: root, group: root, mode: '0750' }

    - name: Check whether the isolated database backup network exists
      ansible.builtin.command: docker network inspect vps_database_backups
      register: backup_network
      changed_when: false
      failed_when: false

    - name: Create the isolated database backup network
      ansible.builtin.command: docker network create --driver bridge --internal vps_database_backups
      when: backup_network.rc != 0

    - name: Render Pangolin's non-secret server configuration from the repository template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../stacks/pangolin/config.yml.j2"
        dest: /opt/pangolin/config/config.yml
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Render Traefik's repository-managed static configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../stacks/pangolin/traefik_config.yml.j2"
        dest: /opt/pangolin/config/traefik/traefik_config.yml
        owner: root
        group: root
        mode: "0640"

    - name: Start the repository-managed Pangolin stack
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - /etc/vps-bootstrap/pangolin.env
          - -f
          - "{{ playbook_dir }}/../../stacks/pangolin/compose.yaml"
          - up
          - -d
      environment:
        BASE_DOMAIN: "{{ vps_base_domain }}"
      register: pangolin_start
      changed_when: "'Started' in pangolin_start.stdout or 'Created' in pangolin_start.stdout"

    - name: Wait for Pangolin's shared Docker network
      ansible.builtin.command: docker network inspect pangolin_frontend
      changed_when: false

    - name: Start the repository-managed Infisical stack
      ansible.builtin.command:
        argv:
          - docker
          - compose
          - --env-file
          - /etc/vps-bootstrap/infisical.env
          - -f
          - "{{ playbook_dir }}/../../stacks/infisical/compose.yaml"
          - up
          - -d
      environment:
        INFISICAL_PUBLIC_DOMAIN: "infisical.{{ vps_base_domain }}"
      register: infisical_start
      changed_when: "'Started' in infisical_start.stdout or 'Created' in infisical_start.stdout"

    - name: Report core service bootstrap status
      ansible.builtin.debug:
        msg:
          - "Pangolin Compose started from the repository."
          - "Infisical Compose started from the repository."
          - "Complete Infisical's first-run setup, then configure the ComposeFlux machine identity and run enable-gitops.yml."
