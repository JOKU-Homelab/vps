---
ansible_admin_group: wheel

# Copy and customize these example accounts in a local host_vars file before
# bootstrap. Never commit real SSH keys or usernames identifying an operator.
vps_users:
  - name: sa_ansible
    comment: Ansible service account
    shell: /bin/bash
    groups:
      - wheel
    public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDTLgNWRdjynB6X2rpL06FwuSQjetgcMkOL+UEfFDUDb
    key_options: no-pty,no-agent-forwarding,no-port-forwarding,no-X11-forwarding
    passwordless_sudo: true
  - name: joku
    comment: VPS operator
    shell: /bin/bash
    groups:
      - wheel
      - docker
    public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAKMQDf49OZXl0EknaWkf1lNFuAjf2HwJksGVQsxCGPw
    passwordless_sudo: true
