---
# Example only: copy to production.local.yml, set a real host, account, and
# key locally, and keep the local file out of Git.
all:
  children:
    vps:
      hosts:
        vps:
          ansible_host: 203.0.113.10
          ansible_user: admin
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519
          ansible_ssh_common_args: -o IdentitiesOnly=yes -o IdentityAgent=none
